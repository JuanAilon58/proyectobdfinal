server.port=8084
spring.application.name=order-service

# Tomcat Tuning
server.tomcat.threads.max=300
server.tomcat.accept-count=500
server.tomcat.max-connections=5000

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashbuy}
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Micrometer/Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Service URLs
services.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service:8083/api/inventory}
services.catalog.url=${CATALOG_SERVICE_URL:http://catalog-service:8081/api/catalog}

# Resilience4j
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=100
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.inventoryService.slowCallDurationThreshold=3000
resilience4j.circuitbreaker.instances.inventoryService.slowCallRateThreshold=50

# TimeLimiter
resilience4j.timelimiter.instances.inventoryService.timeoutDuration=5s

# Bulkhead
resilience4j.bulkhead.instances.inventoryService.maxConcurrentCalls=100
resilience4j.bulkhead.instances.inventoryService.maxWaitDuration=0

