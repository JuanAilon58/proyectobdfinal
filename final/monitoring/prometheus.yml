global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080', 'catalog-service:8081', 'cart-service:8082', 'inventory-service:8083', 'order-service:8084', 'payment-service:8085', 'notification-service:8086']
