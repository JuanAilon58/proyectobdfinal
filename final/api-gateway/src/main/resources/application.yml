server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: mainCircuitBreaker
            fallbackUri: forward:/fallback/message
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8081}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/catalog
                  - /api/catalog/**
        
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://cart-service:8082}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/cart
                  - /api/cart/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/inventory
                  - /api/inventory/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8084}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/orders
                  - /api/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/payments
                  - /api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        registerHealthIndicator: true
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.io.IOException
          - org.springframework.cloud.gateway.support.NotFoundException
