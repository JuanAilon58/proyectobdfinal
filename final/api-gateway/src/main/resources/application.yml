server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/catalog/**
        
        - id: cart-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/cart/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
