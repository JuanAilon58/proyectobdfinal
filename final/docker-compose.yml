services:
  # Infrastructure
  postgres-primary:
    image: postgres:16
    container_name: flashbuy-postgres-primary
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flashbuy
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replpass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/01-replication-setup.sh:/docker-entrypoint-initdb.d/01-replication-setup.sh
    networks:
      flashbuy-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flashbuy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres-replica1:
    image: postgres:16
    container_name: flashbuy-postgres-replica1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flashbuy
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replpass123
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./database/02-replica-entrypoint.sh:/usr/local/bin/02-replica-entrypoint.sh
    entrypoint: ["/bin/bash", "/usr/local/bin/02-replica-entrypoint.sh"]
    depends_on:
      - postgres-primary
    networks:
      - flashbuy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  postgres-replica2:
    image: postgres:16
    container_name: flashbuy-postgres-replica2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flashbuy
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replpass123
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./database/02-replica-entrypoint.sh:/usr/local/bin/02-replica-entrypoint.sh
    entrypoint: ["/bin/bash", "/usr/local/bin/02-replica-entrypoint.sh"]
    depends_on:
      - postgres-primary
    networks:
      - flashbuy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: flashbuy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flashbuy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: flashbuy-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "order-events:1:1,payment-events:1:1"
    depends_on:
      - zookeeper
    networks:
      - flashbuy-network

  zookeeper:
    image: zookeeper:3.9
    container_name: flashbuy-zookeeper
    networks:
      - flashbuy-network

  # Monitoring
  prometheus:
    image: prom/prometheus
    container_name: flashbuy-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - flashbuy-network

  grafana:
    image: grafana/grafana
    container_name: flashbuy-grafana
    ports:
      - "3000:3000"
    networks:
      - flashbuy-network

  # Microservices
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - CART_SERVICE_URL=http://cart-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - ORDER_SERVICE_URL=http://order-service:8084
      - PAYMENT_SERVICE_URL=http://payment-service:8085
    depends_on:
      - catalog-service
      - cart-service
      - order-service
    networks:
      - flashbuy-network

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashbuy
    depends_on:
      - postgres-primary
    networks:
      - flashbuy-network

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - flashbuy-network

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashbuy
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-primary
      - kafka
    networks:
      - flashbuy-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashbuy
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-primary
      - kafka
    networks:
      - flashbuy-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flashbuy
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-primary
      - kafka
    networks:
      - flashbuy-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - flashbuy-network

networks:
  flashbuy-network:
    driver: bridge

volumes:
  postgres_primary_data:
  postgres_replica1_data:
  postgres_replica2_data:
  redis_data:
  kafka_data:
