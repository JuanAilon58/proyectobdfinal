services:
  # Infrastructure
  postgres:
    image: postgres:16
    container_name: flashbuy-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flashbuy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: flashbuy-redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:latest
    container_name: flashbuy-kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: flashbuy-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  # Monitoring
  prometheus:
    image: prom/prometheus
    container_name: flashbuy-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: flashbuy-grafana
    ports:
      - "3000:3000"

  # Microservices (Placeholders for future Dockerfiles)
  # catalog-service:
  #   build: ./catalog-service
  # ...

volumes:
  postgres_data:
